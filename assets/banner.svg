<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Meskine Morty — Bilalmesk</title>
  <desc id="bannerDesc">Black banner with a crimson glow, the name Meskine Morty, a one-line description, platform chips and a glass panel listing current projects.</desc>

  <defs>
    <linearGradient id="heroBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.55" stop-color="#08080b"/>
      <stop offset="1" stop-color="#0d0609"/>
    </linearGradient>

    <radialGradient id="heroBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#e11d48" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="heroDeep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f1d1d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7f1d1d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heroRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#ff4d6d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>

    <pattern id="heroDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>

    <filter id="heroGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>

    <style>
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .drift { animation: drift 24s ease-in-out infinite alternate; }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }
      @keyframes drift {
        from { transform: translate3d(-14px, 8px, 0); }
        to   { transform: translate3d(18px, -10px, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .drift { animation: none; }
      }
    </style>
  </defs>

  <!-- surface -->
  <rect width="1280" height="320" rx="24" fill="url(#heroBase)"/>
  <rect width="1280" height="320" rx="24" fill="url(#heroDots)" opacity="0.7"/>

  <!-- light -->
  <ellipse class="drift" cx="1000" cy="40" rx="520" ry="300" fill="url(#heroBloom)"/>
  <ellipse cx="120" cy="330" rx="520" ry="320" fill="url(#heroDeep)"/>

  <!-- frame -->
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="23.5" fill="none" stroke="#1f1f26" stroke-width="1.5"/>
  <path d="M 28 1 H 300" stroke="url(#heroRule)" stroke-width="1.5"/>

  <!-- identity -->
  <text x="88" y="97" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="5.5" fill="#71717a">BILALMESK</text>

  <text x="84" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="600" letter-spacing="-2" fill="#f7f7f9">Meskine Morty<tspan fill="#ff2d2d">.</tspan></text>

  <text x="88" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9c9ca6">Automation, reverse engineering and streaming tooling</text>

  <!-- platform chips -->
  <g>
    <rect x="88" y="250" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.025" stroke="#2a1519" stroke-width="1"/>
    <g fill="#ff4d6d">
      <rect x="103" y="258" width="5" height="5" rx="1"/>
      <rect x="110" y="258" width="5" height="5" rx="1"/>
      <rect x="103" y="265" width="5" height="5" rx="1"/>
      <rect x="110" y="265" width="5" height="5" rx="1"/>
    </g>
    <text x="126" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#b8b8be">Windows</text>

    <rect x="210" y="250" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.025" stroke="#2a1519" stroke-width="1"/>
    <rect x="225" y="257" width="9" height="15" rx="2" fill="none" stroke="#ff4d6d" stroke-width="1.4"/>
    <circle cx="229.5" cy="268.5" r="1" fill="#ff4d6d"/>
    <text x="244" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#b8b8be">Android</text>

    <rect x="328" y="250" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.025" stroke="#2a1519" stroke-width="1"/>
    <text x="343" y="270" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#ff4d6d">&gt;_</text>
    <text x="360" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#b8b8be">CLI</text>
  </g>

  <!-- now panel -->
  <g>
    <rect x="840" y="52" width="356" height="216" rx="16" fill="#0c0c10" fill-opacity="0.86" stroke="#2a1519" stroke-width="1"/>
    <ellipse cx="1150" cy="60" rx="170" ry="110" fill="url(#cardGlow)"/>
    <path d="M 864 52.75 H 1004" stroke="url(#cardEdge)" stroke-width="1.5"/>

    <circle class="pulse" cx="872" cy="82" r="3.5" fill="#ff2d2d"/>
    <text x="886" y="87" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.8" fill="#c9c9d1">NOW</text>
    <text x="1172" y="87" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#5f5f68">LOCAL-FIRST</text>
    <line x1="860" y1="100" x2="1176" y2="100" stroke="#1c1216" stroke-width="1"/>

    <text x="868" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#6e6e78">BUILDING</text>
    <text x="980" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#ededf2">opencode-usage-tracker</text>

    <text x="868" y="164" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#6e6e78">MAINTAINING</text>
    <text x="980" y="164" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#ededf2">mihon-extensions</text>

    <text x="868" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#6e6e78">EXPLORING</text>
    <text x="980" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#ededf2">reverse engineering</text>

    <line x1="860" y1="216" x2="1176" y2="216" stroke="#1c1216" stroke-width="1"/>
    <text x="868" y="242" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="10.5" fill="#5f5f68">github.com/Bilalmesk</text>
  </g>

  <rect width="1280" height="320" rx="24" filter="url(#heroGrain)" opacity="0.55" style="mix-blend-mode:overlay"/>
</svg>
