<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Meskine Morty — Bilalmesk</title>
  <desc id="bannerDesc">Black banner with a crimson glow, the name Meskine Morty, a one-line description, platform chips and a glass panel listing current projects.</desc>

  <defs>
    <linearGradient id="heroBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.55" stop-color="#08080b"/>
      <stop offset="1" stop-color="#0d0609"/>
    </linearGradient>

    <radialGradient id="heroBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#e11d48" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="heroDeep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f1d1d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7f1d1d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heroRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#ff4d6d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>

    <pattern id="heroDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>

    <filter id="heroGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>

    <style>
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .drift { animation: drift 24s ease-in-out infinite alternate; }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }
      @keyframes drift {
        from { transform: translate3d(-14px, 8px, 0); }
        to   { transform: translate3d(18px, -10px, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .drift { animation: none; }
      }
    </style>
  </defs>

  <!-- surface -->
  <rect width="1280" height="320" rx="24" fill="url(#heroBase)"/>
  <rect width="1280" height="320" rx="24" fill="url(#heroDots)" opacity="0.7"/>

  <!-- light -->
  <ellipse class="drift" cx="1000" cy="40" rx="520" ry="300" fill="url(#heroBloom)"/>
  <ellipse cx="120" cy="330" rx="520" ry="320" fill="url(#heroDeep)"/>

  <!-- frame -->
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="23.5" fill="none" stroke="#1f1f26" stroke-width="1.5"/>
  <path d="M 28 1 H 300" stroke="url(#heroRule)" stroke-width="1.5"/>

  <!-- identity -->
  <text x="88" y="95" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#71717a">BILALMESK</text>

  <text x="84" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="600" letter-spacing="-2.2" fill="#f7f7f9">Meskine Morty<tspan fill="#ff2d2d">.</tspan></text>

  <text x="88" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9c9ca6">Automation, reverse engineering and streaming tooling</text>

  <!-- platform chips -->
  <g>
    <rect x="88" y="250" width="122" height="32" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#2a1519" stroke-width="1"/>
    <g fill="#ff4d6d">
      <rect x="104" y="259" width="5" height="5" rx="1"/>
      <rect x="111" y="259" width="5" height="5" rx="1"/>
      <rect x="104" y="266" width="5" height="5" rx="1"/>
      <rect x="111" y="266" width="5" height="5" rx="1"/>
    </g>
    <text x="128" y="271" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#b8b8be">Windows</text>

    <rect x="220" y="250" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#2a1519" stroke-width="1"/>
    <rect x="236" y="258" width="9" height="16" rx="2" fill="none" stroke="#ff4d6d" stroke-width="1.4"/>
    <circle cx="240.5" cy="270.5" r="1" fill="#ff4d6d"/>
    <text x="256" y="271" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#b8b8be">Android</text>

    <rect x="348" y="250" width="88" height="32" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#2a1519" stroke-width="1"/>
    <text x="364" y="271" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#ff4d6d">&gt;_</text>
    <text x="384" y="271" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#b8b8be">CLI</text>
  </g>

  <!-- now panel -->
  <g>
    <rect x="824" y="46" width="372" height="228" rx="16" fill="#0c0c10" fill-opacity="0.86" stroke="#2a1519" stroke-width="1"/>
    <ellipse cx="1150" cy="56" rx="180" ry="120" fill="url(#cardGlow)"/>
    <path d="M 848 46.75 H 1000" stroke="url(#cardEdge)" stroke-width="1.5"/>

    <circle class="pulse" cx="860" cy="78" r="4" fill="#ff2d2d"/>
    <text x="876" y="83" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#d4d4da">NOW</text>
    <text x="1168" y="83" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#6a6a74">LOCAL-FIRST</text>
    <line x1="848" y1="98" x2="1172" y2="98" stroke="#1c1216" stroke-width="1"/>

    <text x="848" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#74747e">BUILDING</text>
    <text x="984" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#ededf2">opencode-usage-tracker</text>

    <text x="848" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#74747e">MAINTAINING</text>
    <text x="984" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#ededf2">mihon-extensions</text>

    <text x="848" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#74747e">EXPLORING</text>
    <text x="984" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#ededf2">reverse engineering</text>

    <line x1="848" y1="220" x2="1172" y2="220" stroke="#1c1216" stroke-width="1"/>
    <text x="848" y="248" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#6a6a74">github.com/Bilalmesk</text>
  </g>

  <rect width="1280" height="320" rx="24" filter="url(#heroGrain)" opacity="0.55" style="mix-blend-mode:overlay"/>
</svg>
