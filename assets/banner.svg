<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Meskine Morty — Bilalmesk</title>
  <desc id="bannerDesc">Minimal black banner with a soft crimson glow, the name Meskine Morty, a one-line description and an abstract ring motif.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060608"/>
      <stop offset="0.55" stop-color="#08080b"/>
      <stop offset="1" stop-color="#0c0709"/>
    </linearGradient>

    <radialGradient id="bloomA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#e11d48" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f1d1d" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7f1d1d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ff4d6d" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>

    <style>
      .breathe { animation: breathe 8s ease-in-out infinite; transform-origin: 1090px 150px; }
      .breathe2 { animation: breathe 8s ease-in-out infinite 1.6s; transform-origin: 1090px 150px; }
      .drift { animation: drift 22s ease-in-out infinite alternate; }
      @keyframes breathe {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }
      @keyframes drift {
        from { transform: translate3d(-18px, 6px, 0); }
        to   { transform: translate3d(22px, -10px, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .breathe, .breathe2, .drift { animation: none; }
      }
    </style>
  </defs>

  <!-- surface -->
  <rect width="1280" height="300" rx="26" fill="url(#base)"/>
  <rect width="1280" height="300" rx="26" fill="url(#dots)" opacity="0.55"/>

  <!-- soft blooms -->
  <ellipse class="drift" cx="120" cy="-40" rx="560" ry="340" fill="url(#bloomA)"/>
  <ellipse cx="1170" cy="320" rx="540" ry="330" fill="url(#bloomB)"/>

  <!-- hairline frame -->
  <rect x="0.75" y="0.75" width="1278.5" height="298.5" rx="25.5" fill="none" stroke="#1e1e24" stroke-width="1.5"/>
  <path d="M 30 1 H 330" stroke="url(#rule)" stroke-width="1.5"/>

  <!-- identity -->
  <text x="88" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="5.5" fill="#71717a">BILALMESK</text>

  <text x="84" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="600" letter-spacing="-2" fill="#f7f7f9">Meskine Morty<tspan fill="#ff4d6d">.</tspan></text>

  <text x="88" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9c9ca6" letter-spacing="0.2">Automation, reverse engineering and streaming tooling</text>

  <!-- status -->
  <circle cx="95" cy="251" r="4" fill="#ff4d6d"/>
  <text x="111" y="256" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#7d7d87">Building local-first, read-only tools</text>

  <!-- ring motif -->
  <line x1="962" y1="56" x2="962" y2="244" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <circle class="breathe" cx="1090" cy="150" r="112" fill="none" stroke="#ff4d6d" stroke-opacity="0.10" stroke-width="1"/>
  <circle class="breathe2" cx="1090" cy="150" r="78" fill="none" stroke="#ff4d6d" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="1090" cy="150" r="44" fill="none" stroke="#ff4d6d" stroke-opacity="0.30" stroke-width="1"/>

  <circle cx="1090" cy="150" r="70" fill="url(#core)" opacity="0.5"/>
  <circle cx="1090" cy="150" r="4.5" fill="#ff4d6d"/>

  <circle cx="1140" cy="90" r="2.2" fill="#ff4d6d" fill-opacity="0.7"/>
  <circle cx="993" cy="206" r="1.8" fill="#ff4d6d" fill-opacity="0.45"/>

  <!-- texture -->
  <rect width="1280" height="300" rx="26" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
