<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Meskine Morty (Bilalmesk)</title>
  <desc id="bannerDesc">Dark banner reading Meskine Morty, automation, reverse engineering and streaming tooling, with a small terminal card.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090d14"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#1c2431" stroke-width="1"/>
    </pattern>

    <style>
      .cursor { animation: blink 1.15s steps(2, start) infinite; }
      .pulse  { animation: pulse 4s ease-in-out infinite; }
      .pulse2 { animation: pulse 5.5s ease-in-out infinite; }
      @keyframes blink { to { opacity: 0; } }
      @keyframes pulse {
        0%   { opacity: 0.55; }
        50%  { opacity: 1; }
        100% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .pulse, .pulse2 { animation: none; }
      }
    </style>
  </defs>

  <!-- base -->
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)" opacity="0.35"/>

  <!-- ambient glows -->
  <ellipse class="pulse" cx="150" cy="30" rx="360" ry="200" fill="url(#glowCyan)"/>
  <ellipse class="pulse2" cx="1150" cy="300" rx="380" ry="220" fill="url(#glowViolet)"/>

  <!-- frame -->
  <rect x="1" y="1" width="1278" height="318" rx="19.5" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M 40 1 H 340" stroke="url(#accent)" stroke-width="2" opacity="0.9"/>

  <!-- left accent rail -->
  <rect x="56" y="64" width="4" height="192" rx="2" fill="url(#accent)"/>

  <!-- identity -->
  <text x="88" y="100" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="19" fill="#7d8794" letter-spacing="0.5">~/bilalmesk</text>

  <text x="84" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="700" fill="url(#accent)" letter-spacing="1.5">MESKINE MORTY</text>

  <text x="88" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#c9d1d9" letter-spacing="0.4">automation · reverse engineering · streaming tooling</text>

  <!-- status line -->
  <circle class="pulse" cx="96" cy="250" r="5" fill="#22d3ee"/>
  <text x="112" y="256" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="15" fill="#8b949e">building in the open — small tools, sharp edges</text>

  <!-- terminal card -->
  <g>
    <rect x="832" y="62" width="380" height="196" rx="14" fill="#0a0f16" stroke="#243044" stroke-width="1.5"/>
    <rect x="832" y="62" width="380" height="34" rx="14" fill="#111a26"/>
    <rect x="832" y="82" width="380" height="14" fill="#111a26"/>
    <line x1="832" y1="96" x2="1212" y2="96" stroke="#243044" stroke-width="1"/>

    <circle cx="856" cy="79" r="5" fill="#f87171" opacity="0.85"/>
    <circle cx="874" cy="79" r="5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="892" cy="79" r="5" fill="#34d399" opacity="0.85"/>
    <text x="1188" y="84" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#4b5563">zsh</text>

    <text x="858" y="130" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#6b7280">$ whoami</text>
    <text x="858" y="154" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="15" fill="#e6edf3">bilalmesk</text>

    <text x="858" y="188" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#6b7280">$ ls ~/projects</text>
    <text x="858" y="212" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#22d3ee">automation/</text>
    <text x="962" y="212" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#a78bfa">streaming/</text>
    <text x="1058" y="212" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#c9d1d9">tooling/</text>

    <text x="858" y="238" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#6b7280">$</text>
    <rect class="cursor" x="874" y="226" width="9" height="15" fill="#22d3ee"/>
  </g>
</svg>
