<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Meskine Morty (Bilalmesk)</title>
  <desc id="bannerDesc">Black and red banner reading Meskine Morty, automation, reverse engineering and streaming tooling, with a small terminal card.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#100606"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.45" stop-color="#ff2d2d"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>

    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowDeep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#1c0f0f" stroke-width="1"/>
    </pattern>

    <style>
      .cursor { animation: blink 1.15s steps(2, start) infinite; }
      .pulse  { animation: pulse 4s ease-in-out infinite; }
      .pulse2 { animation: pulse 5.5s ease-in-out infinite; }
      @keyframes blink { to { opacity: 0; } }
      @keyframes pulse {
        0%   { opacity: 0.5; }
        50%  { opacity: 1; }
        100% { opacity: 0.5; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .pulse, .pulse2 { animation: none; }
      }
    </style>
  </defs>

  <!-- base -->
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)" opacity="0.45"/>

  <!-- ambient red glows -->
  <ellipse class="pulse" cx="140" cy="20" rx="380" ry="210" fill="url(#glowRed)"/>
  <ellipse class="pulse2" cx="1160" cy="310" rx="400" ry="230" fill="url(#glowDeep)"/>

  <!-- frame -->
  <rect x="1" y="1" width="1278" height="318" rx="19.5" fill="none" stroke="#2a1414" stroke-width="2"/>
  <path d="M 40 1 H 360" stroke="url(#accent)" stroke-width="2.5"/>

  <!-- left accent rail -->
  <rect x="56" y="64" width="4" height="192" rx="2" fill="url(#accent)"/>

  <!-- identity -->
  <text x="88" y="100" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="19" fill="#a17c7c" letter-spacing="0.5">~/bilalmesk</text>

  <text x="84" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="700" fill="url(#accent)" letter-spacing="1.5">MESKINE MORTY</text>

  <text x="88" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#d6d6d6" letter-spacing="0.4">automation · reverse engineering · streaming tooling</text>

  <!-- status line -->
  <circle class="pulse" cx="96" cy="250" r="5" fill="#ff2d2d"/>
  <text x="112" y="256" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="15" fill="#9a7b7b">building in the open — small tools, sharp edges</text>

  <!-- terminal card -->
  <g>
    <rect x="832" y="62" width="380" height="196" rx="14" fill="#080506" stroke="#3a1a1a" stroke-width="1.5"/>
    <rect x="832" y="62" width="380" height="34" rx="14" fill="#160b0b"/>
    <rect x="832" y="82" width="380" height="14" fill="#160b0b"/>
    <line x1="832" y1="96" x2="1212" y2="96" stroke="#3a1a1a" stroke-width="1"/>

    <circle cx="856" cy="79" r="5" fill="#ff2d2d" opacity="0.9"/>
    <circle cx="874" cy="79" r="5" fill="#b91c1c" opacity="0.9"/>
    <circle cx="892" cy="79" r="5" fill="#7f1d1d" opacity="0.9"/>
    <text x="1188" y="84" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#6b4a4a">zsh</text>

    <text x="858" y="130" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#7a5c5c">$ whoami</text>
    <text x="858" y="154" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="15" fill="#f2f2f2">bilalmesk</text>

    <text x="858" y="188" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#7a5c5c">$ ls ~/projects</text>
    <text x="858" y="212" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#ff2d2d">automation/</text>
    <text x="962" y="212" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#ff6b6b">streaming/</text>
    <text x="1058" y="212" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#d6d6d6">tooling/</text>

    <text x="858" y="238" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#7a5c5c">$</text>
    <rect class="cursor" x="874" y="226" width="9" height="15" fill="#ff2d2d"/>
  </g>
</svg>
