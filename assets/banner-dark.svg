<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Meskine Morty — Bilalmesk</title>
  <desc id="heroDesc">Profile cover styled as a terminal: Meskine Morty, automation, reverse engineering and streaming tooling, 236 contributions in the last twelve months.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060607"/>
      <stop offset="0.6" stop-color="#0a0709"/>
      <stop offset="1" stop-color="#12060a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="winEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#2c161b" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff2d2d" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#f7f7f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <clipPath id="winClip"><rect x="40" y="28" width="1200" height="364" rx="20"/></clipPath>
    <clipPath id="avatarClip"><rect x="1001" y="116" width="170" height="170" rx="30"/></clipPath>
    <style>
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .blink, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="26" fill="url(#grid)"/>
  <ellipse cx="1090" cy="40" rx="520" ry="300" fill="url(#glowA)"/>
  <ellipse cx="120" cy="450" rx="480" ry="260" fill="url(#glowA)" opacity="0.55"/>

  <!-- terminal window -->
  <rect x="40" y="28" width="1200" height="364" rx="20" fill="#0c0a0c" fill-opacity="0.96" stroke="url(#winEdge)" stroke-width="1.2"/>
  <g clip-path="url(#winClip)">
    <rect x="40" y="28" width="1200" height="44" fill="#120d10"/>
    <line x1="40" y1="72" x2="1240" y2="72" stroke="#2c161b"/>
  </g>
  <circle cx="68" cy="50" r="6" fill="#ff5f57"/>
  <circle cx="90" cy="50" r="6" fill="#febc2e"/>
  <circle cx="112" cy="50" r="6" fill="#28c840"/>
  <text x="640" y="55" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#767680">bilal@morty — ~/profile — zsh</text>
  <text x="1212" y="55" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#767680">github.com/Bilalmesk</text>

  <!-- whoami -->
  <text x="88" y="112" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#767680"><tspan fill="#ff2d2d">❯</tspan> whoami</text>
  <text x="84" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-2.6" fill="url(#nameFill)">Meskine Morty<tspan class="blink" fill="#ff2d2d" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-weight="400" dx="6">_</tspan></text>
  <text x="88" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#a3a3ad">Automation, reverse engineering and streaming tooling.</text>

  <!-- tools -->
  <text x="88" y="280" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#767680"><tspan fill="#ff2d2d">❯</tspan> ls ~/tools</text>
  <g>
    <rect x="88" y="300" width="162" height="32" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#2c161b"/>
    <circle cx="104" cy="316" r="3" fill="#ff4d6d"/>
    <text x="116" y="320.5" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#a3a3ad">session-recovery</text>
    <rect x="260" y="300" width="210" height="32" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#2c161b"/>
    <circle cx="276" cy="316" r="3" fill="#ff4d6d"/>
    <text x="288" y="320.5" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#a3a3ad">opencode-usage-tracker</text>
    <rect x="480" y="300" width="162" height="32" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#2c161b"/>
    <circle cx="496" cy="316" r="3" fill="#ff4d6d"/>
    <text x="508" y="320.5" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#a3a3ad">mihon-extensions</text>
    <rect x="652" y="300" width="178" height="32" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#2c161b"/>
    <circle cx="668" cy="316" r="3" fill="#ff4d6d"/>
    <text x="680" y="320.5" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#a3a3ad">netflix-speed-keys</text>
  </g>

  <!-- status -->
  <text x="88" y="366" font-family="'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#767680"><tspan fill="#ff2d2d">❯</tspan> status <tspan class="pulse" fill="#ff2d2d">●</tspan> <tspan fill="#a3a3ad">building local-first, read-only analytics</tspan></text>

  <!-- divider -->
  <line x1="950" y1="104" x2="950" y2="372" stroke="#2c161b"/>

  <!-- portrait -->
  <ellipse cx="1086" cy="201" rx="130" ry="130" fill="url(#glowA)" opacity="0.7"/>
  <image href="data:image/jpeg;base64," x="1001" y="116" width="170" height="170" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
  <rect x="1001" y="116" width="170" height="170" rx="30" fill="none" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.5"/>
  <g fill="none" stroke="#ff2d2d" stroke-width="2.5" stroke-linecap="round">
    <path d="M 987 140 V 110 a 14 14 0 0 1 14 -14 H 1031"/>
    <path d="M 1141 96 H 1171 a 14 14 0 0 1 14 14 V 140"/>
    <path d="M 987 262 V 292 a 14 14 0 0 0 14 14 H 1031"/>
    <path d="M 1141 306 H 1171 a 14 14 0 0 0 14 -14 V 262"/>
  </g>

  <!-- headline stat -->
  <text x="1086" y="352" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#f7f7f9">236</text>
  <text x="1086" y="374" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#767680">CONTRIBUTIONS · 12 MO</text>

  <rect width="1280" height="420" rx="26" filter="url(#grain)" opacity="0.45" style="mix-blend-mode:overlay"/>
</svg>
