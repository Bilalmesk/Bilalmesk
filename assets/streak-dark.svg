  <text x="328" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="-1" fill="#ededf2">10</text>
  <text x="328" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1.6" fill="#6a6a74">LONGEST</text>
