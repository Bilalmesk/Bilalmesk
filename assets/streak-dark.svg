  <text x="28" y="40" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#ededf2">Contribution streak</text>
  <text x="467" y="40" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#6a6a74">CONSECUTIVE DAYS</text>
  <line x1="28" y1="56" x2="467" y2="56" stroke="#241318" stroke-width="1"/>
  <line x1="163" y1="82" x2="163" y2="172" stroke="#241318" stroke-width="1"/>
  <line x1="313" y1="82" x2="313" y2="172" stroke="#241318" stroke-width="1"/>
  <text x="28" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="-1" fill="#ededf2">172</text>
  <text x="28" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1.6" fill="#6a6a74">TOTAL · 12 MO</text>
  <text x="178" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="-1" fill="#ff3b5c">1</text>
