<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-label="Contribution streak: 1 days current, 10 days longest">
  <title>Contribution streak: 1 days current, 10 days longest</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3b5c"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="194" rx="16" fill="#0a0a0c" stroke="#2a151b" stroke-width="1"/>
