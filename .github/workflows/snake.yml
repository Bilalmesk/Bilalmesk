name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Bilalmesk
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff2d2d&color_dots=%23161b22,%233d1414,%236b1a1a,%23a51f1f,%23ff3b3b
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff2d2d&color_dots=%230d0d0d,%233d1414,%236b1a1a,%23a51f1f,%23ff3b3b

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
