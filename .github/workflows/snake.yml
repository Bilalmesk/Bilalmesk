name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Bilalmesk
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23e11d48&color_dots=%230a0a0c,%233b1118,%23641420,%239f1239,%23e11d48
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23e11d48&color_dots=%230a0a0c,%233b1118,%23641420,%239f1239,%23e11d48

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
